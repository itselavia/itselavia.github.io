name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      rollback_ref:
        description: 'Optional commit SHA or tag to deploy for rollback'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rollback_ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate site, formatting, unused dependencies, and docs
        run: python3 scripts/validate_site.py --check-format --check-docs

      - name: Run unit and integration tests with coverage and flaky detection
        run: |
          python3 scripts/run_tests.py --check-coverage --repeat 2 2>&1 | tee test-report.log
          echo "### Validation & Test Performance Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 10 test-report.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rollback_ref || github.ref }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build Jekyll site with profiling
        run: |
          bundle exec jekyll build --baseurl "" --profile | tee build-profile.log
          echo "### Jekyll Build Profile" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat build-profile.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          JEKYLL_ENV: production

      - name: Verify built artifact and health endpoint
        run: |
          test -f _site/index.html
          test -f _site/about/index.html
          test -f _site/health.json
          python3 -c 'import json, pathlib; data = json.loads(pathlib.Path("_site/health.json").read_text()); assert data["status"] == "ok" and data["posts_count"] >= 3'
          test ! -e _site/AGENTS.md
          test ! -e _site/Makefile
          test ! -e _site/tests
          test ! -e _site/scripts

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release with automated release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes

  alert_on_failure:
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [validate, build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open incident issue on master pipeline failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Alert: Production pipeline failed on master (${GITHUB_SHA::7})" \
            --label "type: bug,priority: high,area: infra" \
            --body "Automated alert: workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed on commit \`${GITHUB_SHA}\`. Follow \`docs/runbook.md\` to triage or roll back."
