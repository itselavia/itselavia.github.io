repos:
  - repo: local
    hooks:
      - id: validate-site-and-docs
        name: Validate Jekyll site, formatting, secrets, and documentation
        entry: python3 scripts/validate_site.py --check-format --check-docs
        language: system
        pass_filenames: false
      - id: unit-and-integration-tests
        name: Run unit and integration test suite with coverage and flaky check
        entry: python3 scripts/run_tests.py --check-coverage --repeat 2
        language: system
        pass_filenames: false
